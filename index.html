<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2A2460">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Путь кармы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    --ink: #221D45; --ink-2: #4A4570; --ink-3: #7A75A0;
    --paper: rgba(255,255,255,.66); --paper-2: rgba(255,255,255,.86);
    --sheet: rgba(250,246,240,.86); --sheet-line: rgba(255,255,255,.75);
    --rule: rgba(34,29,69,.14); --rule-soft: rgba(34,29,69,.07);
    --mark: #F3D98C; --mark-ink: #2B1C05;
    --red: #B4472F; --green: #2E7A5A; --focus: #6A5FC8;
    --goldline: rgba(185,130,42,.55);
    --sans: "Golos Text", "Segoe UI", Roboto, system-ui, sans-serif;
    --serif: "Cormorant Garamond", "Literata", Georgia, serif;
    --gold: linear-gradient(180deg,#FBE7A8 0%,#E2B65A 42%,#B9822A 78%,#8E5E16 100%);
    --gold-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 4px rgba(90,55,10,.4), 0 3px 0 #6E4610, 0 10px 22px rgba(160,110,30,.35);
    --veil-top: rgba(27,23,56,.35); --veil-bot: rgba(27,23,56,.55);
    --card-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 8px 22px rgba(34,29,69,.07);
  }
  :root[data-theme="dark"] {
    --ink: #F5F1FF; --ink-2: #CFC8EA; --ink-3: #9C95C2;
    --paper: rgba(255,255,255,.07); --paper-2: rgba(255,255,255,.12);
    --sheet: rgba(20,17,48,.78); --sheet-line: rgba(255,255,255,.14);
    --rule: rgba(255,255,255,.16); --rule-soft: rgba(255,255,255,.08);
    --red: #F2A08C; --green: #8FD6B4; --focus: #C9BFFF;
    --goldline: rgba(233,199,122,.5);
    --veil-top: rgba(12,10,32,.35); --veil-bot: rgba(12,10,32,.7);
    --card-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 8px 22px rgba(0,0,0,.25);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { min-height: 100%; }
  * { box-sizing: inherit; }
  body { margin: 0; background: #1B1738; color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  #bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #2A2460; }
  #bg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
  #bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, var(--veil-top) 0%, rgba(27,23,56,0) 18%, rgba(27,23,56,0) 30%, var(--veil-bot) 100%); }
  .wrap { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px calc(40px + env(safe-area-inset-bottom, 0px)); }
  body.live .wrap { padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
  header.top { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 10px; }
  header.top .brand { font-family: var(--serif); font-size: 26px; font-weight: 700; color: #fff; text-decoration: none; white-space: nowrap; text-shadow: 0 2px 12px rgba(20,15,50,.55); letter-spacing: .01em; }
  header.top .nav { display: flex; gap: 8px; margin-left: 12px; }
  header.top .nav a { color: #fff; text-decoration: none; font-size: 14px; white-space: nowrap; padding: 7px 12px; border-radius: 16px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  header.top .nav a.on { background: rgba(255,255,255,.3); }

  /* hero над листом */
  .hero { color: #fff; padding: 4px 8px 16px; text-shadow: 0 2px 14px rgba(20,15,50,.55); }
  .hero .hl { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; }
  .hero .hl img { width: 34px; height: 34px; }
  .hero .hd { font-family: var(--serif); font-size: 40px; font-weight: 700; line-height: 1.02; margin-top: 4px; }
  .hero .hs { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #FFF1D6; margin-top: 6px; }

  /* лист */
  #app { background: var(--sheet); border: 1px solid var(--sheet-line); border-radius: 26px; padding: 20px 18px 22px; -webkit-backdrop-filter: blur(18px) saturate(1.1); backdrop-filter: blur(18px) saturate(1.1); box-shadow: 0 18px 50px rgba(15,12,40,.35); }
  #app > :first-child { margin-top: 0; }

  h1 { font-family: var(--serif); font-weight: 700; font-size: 34px; line-height: 1.08; margin: 6px 0 14px; }
  h1.q { font-size: 28px; }
  h2 { font-family: var(--serif); font-weight: 700; font-size: 26px; line-height: 1.12; margin: 24px 0 10px; }
  h3 { font-size: 16px; font-weight: 600; margin: 18px 0 6px; }
  p { margin: 0 0 12px; max-width: 62ch; }
  .muted { color: var(--ink-2); } .small { font-size: 14px; }
  .quote { font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1.35; margin: 14px 0; }
  .axiom { font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--ink-2); margin: 0 0 12px; }
  .sage { border-top: 1px solid var(--goldline); padding-top: 12px; margin: 16px 0 6px; }
  .sage .t { font-family: var(--serif); font-size: 20px; font-style: italic; line-height: 1.4; }
  .sage .a { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
  ul { padding-left: 22px; margin: 0 0 12px; } li { margin-bottom: 5px; }
  a { color: var(--ink); }

  .card { background: var(--paper); border: 1px solid var(--rule); border-radius: 18px; padding: 16px 18px; margin: 12px 0; box-shadow: var(--card-shadow); }
  .card.mark { background: linear-gradient(180deg, #FFFBEF, #F8ECCD); border-color: rgba(201,154,62,.55); color: #2A2048; }
  :root[data-theme="dark"] .card.mark { background: linear-gradient(180deg, rgba(86,74,160,.55), rgba(44,37,98,.55)); border-color: rgba(233,199,122,.5); color: var(--ink); }
  .card.mark .muted, .card.mark .k { color: inherit; opacity: .78; }
  .card .k { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .card .k img.ic { width: 26px; height: 26px; margin: -4px 0; }
  .card.mark .sage { border-color: var(--goldline); }
  .task { border-left: 3px solid #C99A3E; padding: 4px 0 4px 14px; margin: 12px 0; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 700; cursor: pointer; border-radius: 28px; padding: 12px 20px; border: 0; background: var(--gold); color: #2B1C05; min-height: 52px; text-decoration: none; text-align: center; box-shadow: var(--gold-shadow); transition: transform .08s; }
  .btn:active { transform: translateY(2px); }
  .btn.secondary { background: var(--paper-2); color: var(--ink); border: 1px solid var(--goldline); box-shadow: var(--card-shadow); font-weight: 600; }
  .btn.ghost { background: transparent; border: 0; box-shadow: none; color: var(--ink-2); font-weight: 500; padding-left: 8px; padding-right: 8px; min-height: 44px; }
  .btn.sos { background: var(--paper-2); color: var(--red); border: 1px solid var(--red); box-shadow: var(--card-shadow); font-weight: 600; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, .chip:focus-visible, .stepcard:focus-visible, summary:focus-visible, a:focus-visible, .tap:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; } .row .btn { flex: 1 1 auto; }

  label { display: block; font-weight: 500; margin: 14px 0 6px; }
  input[type="date"], input[type="text"], input[type="time"] { font: inherit; width: 100%; padding: 11px 14px; border: 1px solid var(--rule); border-radius: 14px; background: var(--paper-2); color: var(--ink); min-height: 48px; }
  textarea { font: inherit; width: 100%; min-height: 112px; padding: 8px 14px; border: 1px solid var(--rule); border-radius: 14px; color: var(--ink); resize: vertical; line-height: 28px;
    background-color: var(--paper-2); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, var(--rule-soft) 27px, var(--rule-soft) 28px); background-attachment: local; background-position: 0 8px; }
  ::placeholder { color: var(--ink-3); }
  .hint { font-size: 14px; color: var(--ink-2); margin-top: 6px; }
  .flag { border-left: 3px solid var(--red); padding: 8px 12px; margin: 10px 0; font-size: 15px; background: var(--paper); border-radius: 0 12px 12px 0; }
  .nudge { border-left: 3px solid #C99A3E; padding: 8px 12px; margin: 10px 0; font-size: 15px; background: var(--paper); border-radius: 0 12px 12px 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .chip { font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 18px; border: 1px solid var(--rule); background: var(--paper-2); color: var(--ink); cursor: pointer; text-align: left; line-height: 1.3; }
  .chip.on { background: var(--gold); color: #2B1C05; border-color: transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 3px 8px rgba(160,110,30,.25); }
  .chips.col { flex-direction: column; } .chips.col .chip { border-radius: 14px; padding: 12px 14px; }

  /* астролябия и шар с цифрой */
  .astro { position: relative; width: calc(100% + 36px); margin: -20px -18px 4px; aspect-ratio: 1312 / 1199; border-radius: 26px 26px 0 0; overflow: hidden; background: linear-gradient(180deg, #CDB6E0, #D9C6E6); }
  :root[data-theme="dark"] .astro { background: linear-gradient(180deg, #3A2F70, #2A2358); }
  .astro > img { width: 100%; height: 100%; object-fit: cover; display: block; -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 74%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(180deg, #000 0%, #000 74%, rgba(0,0,0,0) 100%); }
  .orb { position: absolute; left: 50%; top: 45.5%; width: 31%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; padding: 5%; background: conic-gradient(from 20deg, #FFF3C4, #C8902E, #FBE7A8, #8E5E16, #FFF3C4, #B9822A, #FBE7A8, #7A4E12, #FFF3C4); box-shadow: 0 0 0 1px rgba(110,70,16,.6), 0 0 26px rgba(255,214,140,.5), 0 12px 22px rgba(34,29,69,.45); }
  .orb .core { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 34% 26%, #5E54C0 0%, #2A2478 36%, #17134C 68%, #0C0A2E 100%); box-shadow: inset 0 0 0 2px rgba(251,231,168,.85), inset 0 0 0 5px rgba(20,16,60,.9), inset 0 0 0 6px rgba(226,182,90,.55), inset 0 -12px 20px rgba(0,0,0,.5), inset 0 8px 16px rgba(255,255,255,.16); }
  .orb .core::after { content: ""; position: absolute; left: 16%; top: 9%; width: 40%; height: 20%; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255,255,255,.4), rgba(255,255,255,0)); transform: rotate(-22deg); }
  .orb .fl { position: absolute; inset: 4%; border-radius: 50%; background: radial-gradient(circle, rgba(200,190,255,.75) 0%, rgba(140,120,230,.45) 40%, rgba(80,60,180,0) 72%); opacity: 0; }
  .orb .num { position: absolute; left: 10%; top: 8%; width: 80%; height: 80%; opacity: 0; }
  .orb.calc { animation: pkPulse 1.1s ease-in-out infinite; }
  .orb.shown { animation: none; box-shadow: 0 0 0 1px rgba(110,70,16,.6), 0 0 46px rgba(255,214,140,.9), 0 0 90px rgba(255,200,120,.45), 0 14px 24px rgba(34,29,69,.45); }
  .orb.shown .fl { opacity: .75; } .orb.shown .num { opacity: 1; filter: drop-shadow(0 0 10px rgba(255,214,140,.85)); }
  .orb.reveal .fl { animation: pkFlash .9s ease-out both; } .orb.reveal .num { animation: pkNum 1s ease-out .1s both; }
  @keyframes pkPulse { 0%,100% { box-shadow: 0 0 0 1px rgba(110,70,16,.6), 0 0 18px rgba(255,214,140,.35), 0 14px 24px rgba(34,29,69,.45); } 50% { box-shadow: 0 0 0 1px rgba(110,70,16,.6), 0 0 44px rgba(255,214,140,.9), 0 14px 24px rgba(34,29,69,.45); } }
  @keyframes pkFlash { 0% { opacity: 0; transform: scale(.3); } 35% { opacity: 1; transform: scale(1.15); } 100% { opacity: .75; transform: scale(1); } }
  @keyframes pkNum { 0% { opacity: 0; transform: scale(.55); filter: blur(6px); } 60% { opacity: 1; transform: scale(1.08); filter: blur(0) drop-shadow(0 0 18px rgba(255,230,170,1)); } 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 10px rgba(255,214,140,.85)); } }
  .pathname { text-align: center; } .pathname h1 { margin-bottom: 4px; }

  .digits { font-family: var(--serif); font-size: 26px; line-height: 1.4; min-height: 70px; margin: 8px 0 14px; text-align: center; }
  .digits .sum { display: block; margin-top: 6px; font-size: 40px; font-weight: 700; }
  .digits span.d { opacity: 0; transition: opacity .25s; } .digits span.d.on { opacity: 1; }

  .stepcard { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--paper-2); border: 1px solid var(--rule); border-radius: 16px; padding: 14px 16px; margin: 10px 0; cursor: pointer; box-shadow: var(--card-shadow); }
  .stepcard.on { background: linear-gradient(180deg, #FFF7E0, #F6E2B0); color: #2A2048; border-color: rgba(201,154,62,.7); }
  :root[data-theme="dark"] .stepcard.on { background: linear-gradient(180deg, rgba(120,100,40,.55), rgba(80,64,24,.55)); color: var(--ink); }
  .stepcard .t { font-weight: 600; } .stepcard .d { font-size: 15px; margin-top: 3px; color: var(--ink-2); }
  .stepcard.on .d { color: inherit; opacity: .8; }
  .stepcard.goal { border-style: dashed; }

  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; flex-wrap: wrap; background: var(--paper); }
  .seg button { font: inherit; background: transparent; color: var(--ink); border: 0; padding: 10px 14px; cursor: pointer; }
  .seg button.on { background: var(--gold); color: #2B1C05; font-weight: 600; }

  .progress { height: 5px; background: var(--rule); border-radius: 3px; margin: 4px 0 18px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, #E2B65A, #B9822A); transition: width .2s; }

  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 4px 0 6px; }
  .cal .c { text-align: center; padding: 6px 0 7px; border-radius: 12px; border: 1px solid transparent; }
  .cal .c .w { font-size: 12px; color: var(--ink-3); }
  .cal .c .n { font-size: 16px; font-weight: 500; line-height: 1.3; }
  .cal .c .dots { display: flex; justify-content: center; gap: 4px; margin-top: 3px; height: 7px; }
  .cal .c .dots i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink-3); }
  .cal .c .dots i.f { background: #C99A3E; border-color: #C99A3E; }
  .cal .c.today { border-color: #C99A3E; background: var(--paper-2); }
  .cal .c.missed .n { color: var(--ink-3); text-decoration: line-through; }
  .cal .c.future .n { color: var(--ink-3); }
  .callegend { font-size: 12px; color: var(--ink-3); }

  .scale { display: flex; gap: 6px; align-items: flex-end; height: 56px; margin: 10px 0 4px; }
  .scale .bar { flex: 1; background: var(--rule); border-radius: 4px 4px 0 0; min-height: 4px; }
  .scale .bar.hot { background: linear-gradient(180deg, #E8826A, #B4472F); } .scale .bar.cool { background: linear-gradient(180deg, #8ED2B0, #2E7A5A); }
  .scale .bar:not(.hot):not(.cool):not(.empty) { background: linear-gradient(180deg, #F3D98C, #C99A3E); }
  .scale .bar.empty { background: transparent; border: 1px dashed var(--rule); }
  .scale-labels { display: flex; gap: 6px; } .scale-labels span { flex: 1; text-align: center; font-size: 12px; color: var(--ink-3); }

  .range-val { font-family: var(--serif); font-size: 52px; font-weight: 700; line-height: 1; color: #B9822A; }
  :root[data-theme="dark"] .range-val { color: #F3D98C; }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; margin: 8px 0 2px; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track { height: 12px; border-radius: 6px; background: linear-gradient(to right, #6FC09A, #F3D98C 50%, #E07A62); box-shadow: inset 0 1px 2px rgba(0,0,0,.2); }
  input[type="range"]::-moz-range-track { height: 12px; border-radius: 6px; background: linear-gradient(to right, #6FC09A, #F3D98C 50%, #E07A62); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF6D0, #E2B65A 55%, #8E5E16); border: 2px solid #FFF3C4; margin-top: -12px; box-shadow: 0 3px 8px rgba(0,0,0,.35); }
  input[type="range"]::-moz-range-thumb { width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF6D0, #E2B65A 55%, #8E5E16); border: 2px solid #FFF3C4; }
  input[type="range"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .range-hint { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }

  details.portrait { margin: 12px 0; } details.portrait summary { cursor: pointer; color: var(--ink-2); font-size: 15px; padding: 6px 0; }
  .prow { padding: 8px 0; border-top: 1px solid var(--rule); } .prow:first-child { border-top: 0; }

  .ladder svg { width: 100%; height: auto; display: block; max-width: 330px; }
  .ladder .step rect { fill: var(--paper-2); stroke: var(--ink); stroke-width: 2; }
  .ladder .step.passed rect { fill: var(--rule-soft); stroke: var(--ink-3); }
  .ladder .step.current rect { fill: #F3D98C; stroke: var(--ink); }
  .ladder .step.goal rect { stroke-dasharray: 5 4; }
  .ladder .step text { font-family: var(--sans); font-size: 13px; fill: var(--ink-2); }
  .ladder .you circle { fill: var(--ink); } .ladder .you line { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
  .ladder .ground { stroke: var(--ink-3); stroke-width: 1; }

  .arc { list-style: none; padding: 0; margin: 6px 0 0; }
  .arc li { display: flex; gap: 10px; padding: 5px 0; font-size: 15px; color: var(--ink-3); }
  .arc li b { width: 18px; flex: none; font-weight: 500; text-align: right; }
  .arc li.done { color: var(--ink-2); } .arc li.done span { text-decoration: line-through; text-decoration-color: var(--ink-3); }
  .arc li.now { color: var(--ink); font-weight: 600; }

  .taps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0 4px; }
  .tap { font: inherit; border-radius: 20px; padding: 10px 10px 12px; cursor: pointer; border: 1px solid var(--goldline); background: var(--paper-2); color: var(--ink); text-align: center; box-shadow: var(--card-shadow); display: flex; flex-direction: column; align-items: center; }
  .tap img { width: 46px; height: 46px; }
  .tap b { display: block; font-family: var(--serif); font-size: 30px; font-weight: 700; line-height: 1; }
  .tap span { font-size: 14px; color: var(--ink-2); }
  .tap.hit b { color: var(--red); } .tap.hold b { color: var(--green); }
  .tap:active { transform: scale(.97); }

  .list { list-style: none; padding: 0; } .list li { border-top: 1px solid var(--rule); padding: 12px 0; }
  .list .date { font-size: 13px; color: var(--ink-3); margin-bottom: 4px; }
  .toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: rgba(27,23,56,.92); color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; border: 1px solid rgba(233,199,122,.5); max-width: 90vw; }
  .toast.on { opacity: 1; }
  .testbar { font-size: 13px; color: #fff; text-align: center; padding: 6px; border: 1px dashed rgba(255,255,255,.7); border-radius: 12px; margin-bottom: 10px; background: rgba(180,71,47,.55); }
  .testbar a { color: #fff; }
  .zones { display: grid; gap: 4px; margin: 10px 0 0; font-size: 13px; color: var(--ink-2); }
  .zones span { display: flex; gap: 8px; align-items: center; } .zones i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .zonelabel { font-size: 14px; color: var(--ink-2); margin: 4px 0 0; min-height: 20px; }
  .can { display: flex; gap: 12px; align-items: center; margin: 8px 0; }
  .can svg { width: 54px; height: 44px; flex: none; }
  .tappanel { border-top: 1px solid var(--rule); margin-top: 12px; padding-top: 10px; }
  .linklike { color: inherit; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; display: inline-block; padding: 6px 0; }
  .seg.freq4 { display: grid; grid-template-columns: repeat(2, 1fr); width: 100%; } .seg.freq4 button { font-size: 14px; padding: 9px 6px; }
  .seg.freq { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; } .seg.freq button { font-size: 14px; padding: 9px 6px; }
  .clock { font-size: 14px; color: var(--ink-2); margin: 0 0 6px; }
  .moments { list-style: none; padding: 0; margin: 6px 0 0; font-size: 15px; } .moments li { padding: 3px 0; }
  .stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 0 4px 12px; }
  .stages div { font-size: 11px; color: rgba(255,255,255,.75); text-align: center; text-shadow: 0 1px 6px rgba(20,15,50,.6); }
  .stages div i { display: block; height: 4px; border-radius: 2px; background: rgba(255,255,255,.35); margin-bottom: 4px; }
  .stages div.done i { background: linear-gradient(90deg, #E2B65A, #B9822A); } .stages div.now i { background: linear-gradient(90deg, #FBE7A8, #E2B65A); box-shadow: 0 0 8px rgba(251,231,168,.8); } .stages div.now { color: #fff; font-weight: 600; }
  .steps3 { list-style: none; padding: 0; margin: 10px 0; }
  .steps3 li { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--rule); align-items: start; }
  .steps3 li:first-child { border-top: 0; }
  .steps3 li img { width: 48px; height: 48px; }
  .moment-card { padding: 12px 14px; margin: 10px 0; }
  .box { width: 220px; height: 220px; margin: 18px auto 6px; display: block; }
  .boxlabel { text-align: center; font-family: var(--serif); font-size: 30px; font-weight: 700; min-height: 36px; }
  .boxcount { text-align: center; color: var(--ink-2); font-size: 14px; }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 15; }
  .confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall 3.2s ease-in forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .9; } }
  .fanfare { font-family: var(--serif); font-size: 40px; font-weight: 700; text-align: center; margin: 10px 0 4px; background: linear-gradient(180deg, #FBE7A8, #C8902E 60%, #8E5E16); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; text-align: center; }
  .stats div { background: var(--paper-2); border: 1px solid var(--rule); border-radius: 16px; padding: 10px 4px; }
  .stats b { display: block; font-family: var(--serif); font-size: 30px; font-weight: 700; }
  .stats span { font-size: 12px; color: var(--ink-2); }
  .lines label { font-weight: 500; }
  .gsteps { display: flex; gap: 4px; margin: 10px 0; } .gsteps i { flex: 1; height: 6px; border-radius: 3px; background: var(--rule); } .gsteps i.on { background: linear-gradient(90deg, #FBE7A8, #E2B65A); }

  /* сцена: путник на тропе */
  .scene { margin: 4px 0; }
  .trail { position: relative; border-radius: 20px; overflow: hidden; height: 236px; background: #3A2F70; box-shadow: 0 10px 26px rgba(15,12,40,.3); }
  .trail > img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 32%; display: block; }
  .trail .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(40,34,90,.95), rgba(60,54,110,.75)); mix-blend-mode: multiply; }
  .trail .glow { position: absolute; inset: 0; background: radial-gradient(circle at 80% 18%, rgba(255,236,180,.85), rgba(255,236,180,0) 55%); }
  .trail .tb { position: absolute; top: 10px; display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px 4px 4px; border-radius: 16px; font-size: 13px; font-weight: 600; color: #fff; background: rgba(27,23,56,.42); border: 1px solid rgba(255,255,255,.3); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .trail .tb img { width: 28px; height: 28px; } .trail .tb.l { left: 10px; } .trail .tb.r { right: 10px; }
  .trail .tpath { position: absolute; left: 14px; right: 50px; bottom: 16px; height: 34px; }
  .trail .tline { position: absolute; left: 0; right: 0; top: 15px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.35); }
  .trail .tline i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #FBE7A8, #E2B65A); box-shadow: 0 0 8px rgba(251,231,168,.8); }
  .trail .tline s { position: absolute; top: -1px; width: 7px; height: 7px; border-radius: 50%; background: #8B8F9A; border: 1px solid #fff; }
  .trail .me { position: absolute; top: 5px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF6D0, #E2B65A 55%, #8E5E16); border: 2px solid #fff; box-shadow: 0 0 10px rgba(251,231,168,.9); }
  .trail .tflag { position: absolute; right: -44px; bottom: -6px; width: 44px; height: 44px; }

  /* таббар */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: none; justify-content: center; padding: 0 8px; }
  body.live .tabbar { display: flex; }
  .tabbar nav { width: 100%; max-width: 520px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 6px calc(10px + env(safe-area-inset-bottom, 0px)); border-radius: 24px 24px 0 0; background: linear-gradient(180deg, rgba(40,34,84,.86), rgba(22,18,48,.95)); border: 1px solid rgba(255,255,255,.18); border-bottom: 0; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 -8px 26px rgba(10,8,30,.35); }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 1px; text-decoration: none; color: #CFC8E8; font-size: 12px; min-height: 52px; }
  .tabbar a img { width: 36px; height: 36px; opacity: .8; }
  .tabbar a.on { color: #F6DE9A; font-weight: 600; } .tabbar a.on img { opacity: 1; filter: drop-shadow(0 0 8px rgba(246,222,154,.7)); }

  /* источники */
  .src { list-style: none; padding: 0; margin: 4px 0 0; }
  .src li { padding: 9px 0; border-top: 1px solid var(--rule); font-size: 15px; line-height: 1.45; }
  .src li:first-child { border-top: 0; }
  .src .w { font-size: 13px; color: var(--ink-2); }
  .src .use { display: inline-block; font-size: 12px; margin-top: 3px; padding: 2px 8px; border-radius: 10px; background: rgba(201,154,62,.18); color: inherit; }
  .icline { display: flex; gap: 10px; align-items: flex-start; } .icline img { width: 40px; height: 40px; flex: none; margin-top: -4px; }

  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } .orb.calc, .orb.reveal .fl, .orb.reveal .num { animation: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

/* =================== GENERIC QUESTION FLOW =================== */
function flow({ qs, c, title, onDone, onCancel }) {
  const ans = {}; let i = 0; const nudged = {};
  const visible = () => qs.filter(q => !(q.skipIf && ans[q.skipIf[0]] === q.skipIf[1]) && !(q.skip && q.skip(ans)));
  const render = () => {
    const vis = visible(); const q = vis[i];
    const qt = typeof q.q === "function" ? q.q(c, ans) : q.q;
    const lead = q.lead ? (typeof q.lead === "function" ? q.lead(c, ans) : q.lead) : "";
    let body = "";
    if (q.type === "text") body = `<textarea id="a" placeholder="${esc(q.ph || "")}">${esc(ans[q.k] || "")}</textarea>`;
    else if (q.type === "short") body = `<input type="text" id="a" placeholder="${esc(q.ph || "")}" value="${esc(ans[q.k] || "")}">${q.tags ? `<div class="chips" id="tg">${(typeof q.tags === "function" ? q.tags(c) : q.tags).map(o => `<button class="chip" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>` : ""}`;
    else if (q.type === "lines") body = `<div class="lines">${q.labels(c).map((l, j) => `<label for="a${j}">${esc(l)}</label><input type="text" id="a${j}" value="${esc((ans[q.k] || [])[j] || "")}">`).join("")}</div>`;
    else if (q.type === "scale") { const v = ans[q.k] != null ? ans[q.k] : q.def(c); body = `<div class="range-val" id="scv">${v}</div><input type="range" id="sc" min="0" max="10" step="1" value="${v}" aria-label="${esc(qt)}"><div class="range-hint"><span>${esc(q.lo)}</span><span>${esc(q.hi)}</span></div>`; }
    else if (q.type === "chips2") { const s1 = ans[q.k] || [], s2 = ans[q.k2] || []; body = `<p class="small muted" style="margin:6px 0 0">${esc(q.l1)}</p><div class="chips" id="ch">${q.opts.map(o => `<button class="chip ${s1.includes(o) ? "on" : ""}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div><p class="small muted" style="margin:10px 0 0">${esc(q.l2)}</p><div class="chips" id="ch2">${(typeof q.opts2 === "function" ? q.opts2(c) : q.opts2).map(o => `<button class="chip ${s2.includes(o) ? "on" : ""}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div><input type="text" id="other" placeholder="Своими словами" value="${esc(ans[q.k2 + "_other"] || "")}">`; }
    else if (q.type === "three") body = [0, 1, 2].map(j => `<label for="a${j}">${(q.lbl || ["Первое", "Второе", "Третье"])[j]}</label><input type="text" id="a${j}" value="${esc((ans[q.k] || [])[j] || "")}">`).join("");
    else if (q.type === "choice") body = `<div class="chips col" id="ch">${q.opts.map(o => `<button class="chip ${ans[q.k] === o ? "on" : ""}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
    else if (q.type === "chips") { const sel = ans[q.k] || []; body = `<div class="chips" id="ch">${(typeof q.opts === "function" ? q.opts(c) : q.opts).map(o => `<button class="chip ${sel.includes(o) ? "on" : ""}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>${q.other ? `<input type="text" id="other" placeholder="Своими словами" value="${esc(ans[q.k + "_other"] || "")}">` : ""}`; }
    app.innerHTML = `
      ${title ? `<p class="small muted" style="margin:0 0 6px">${esc(title)}</p>` : ""}
      <div class="progress"><i style="width:${(i / vis.length) * 100}%"></i></div>
      ${lead ? `<p class="muted" style="margin-bottom:6px">${esc(lead)}</p>` : ""}
      <h1 class="q">${esc(qt)}</h1>
      ${body}
      ${q.hint ? `<p class="hint">${esc(typeof q.hint === "function" ? q.hint(c, ans) : q.hint)}</p>` : ""}
      <div id="flag"></div>
      <div class="row"><button class="btn block" id="next">${q.optional ? "Дальше (можно пропустить)" : i === vis.length - 1 ? "Готово" : "Дальше"}</button></div>
      <div class="row" style="margin-top:0">${i > 0 ? `<button class="btn ghost" id="back">Назад</button>` : onCancel ? `<button class="btn ghost" id="cancel">Отмена</button>` : ""}</div>`;
    const a = document.getElementById("a") || document.getElementById("a0");
    if (a) { a.focus(); a.oninput = () => { document.getElementById("flag").innerHTML = FLAG_RE.test(a.value) ? `<div class="flag">Похоже на попытку изменить учителя. Менять другого никому не дано — меняешься ты, меняется мир вокруг. Что здесь можешь изменить ты?</div>` : ""; }; }
    const tg = document.getElementById("tg"); if (tg) tg.querySelectorAll(".chip").forEach(b => b.onclick = () => { a.value = b.dataset.v; tg.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b)); a.dispatchEvent(new Event("input")); });
    const sc = document.getElementById("sc"); if (sc) sc.oninput = () => { document.getElementById("scv").textContent = sc.value; };
    const ch2 = document.getElementById("ch2"); if (ch2) ch2.querySelectorAll(".chip").forEach(b => b.onclick = () => { const s = ans[q.k2] = ans[q.k2] || []; const v = b.dataset.v, ix = s.indexOf(v); if (ix >= 0) s.splice(ix, 1); else s.push(v); b.classList.toggle("on"); });
    const ch = document.getElementById("ch");
    if (ch) ch.querySelectorAll(".chip").forEach(b => b.onclick = () => {
      const v = b.dataset.v;
      if (q.type === "choice") { ans[q.k] = v; ch.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b)); if (q.note) document.getElementById("flag").innerHTML = q.note(ans) || ""; }
      else { const s = ans[q.k] = ans[q.k] || []; const ix = s.indexOf(v); if (ix >= 0) s.splice(ix, 1); else s.push(v); b.classList.toggle("on"); }
    });
    document.getElementById("next").onclick = () => {
      if (q.type === "text" || q.type === "short") {
        const v = a.value.trim(); if (!v && !q.optional) return toast("Напиши хотя бы пару слов");
        if (q.mirror && !nudged[q.k] && NONE_RE.test(v)) { nudged[q.k] = true; document.getElementById("flag").innerHTML = `<div class="nudge">Если бы этого не было в тебе — не цепляло бы. Попробуй ещё раз: хотя бы в малом, хотя бы с кем-то другим.</div>`; return; }
        ans[q.k] = v;
      } else if (q.type === "lines") {
        const v = q.labels(c).map((_, j) => document.getElementById("a" + j).value.trim());
        if (!v[0]) return toast("Допиши хотя бы первую фразу");
        ans[q.k] = v;
      } else if (q.type === "scale") { ans[q.k] = Number(document.getElementById("sc").value);
      } else if (q.type === "chips2") {
        const o = document.getElementById("other"); ans[q.k2 + "_other"] = o.value.trim();
        if (!(ans[q.k] || []).length && !(ans[q.k2] || []).length && !o.value.trim()) return toast("Отметь хотя бы одно");
      } else if (q.type === "three") {
        const v = [0, 1, 2].map(j => document.getElementById("a" + j).value.trim()), nf = v.filter(Boolean).length;
        if (q.few) { if (!nf) { document.getElementById("flag").innerHTML = `<div class="nudge">${esc(q.few)}</div>`; return; } if (nf < 3 && !nudged[q.k]) { nudged[q.k] = true; document.getElementById("flag").innerHTML = `<div class="nudge">Нашлось ${nf} из 3. Вернись на шаг назад и попробуй другую форму или другое качество. Если уверен — нажми «Дальше» ещё раз.</div>`; return; } }
        else if (nf < 3) return toast("Найди все три — даже маленькие");
        ans[q.k] = v;
      } else if (q.type === "choice") { if (!ans[q.k]) return toast("Выбери вариант"); if (q.onPick && q.onPick(ans)) return; }
      else if (q.type === "chips") {
        const o = document.getElementById("other"); if (o) ans[q.k + "_other"] = o.value.trim();
        if (!(ans[q.k] || []).length && !(o && o.value.trim())) return toast("Отметь хотя бы одно");
      }
      if (i === visible().length - 1) onDone(ans); else { i++; render(); window.scrollTo(0, 0); }
    };
    const back = document.getElementById("back"); if (back) back.onclick = () => { i--; render(); };
    const cancel = document.getElementById("cancel"); if (cancel) cancel.onclick = onCancel;
  };
  render();
}

function path() {
  const t = PATHS[S.num], list = RECOG[S.num], yes = Object.values(S.recog || {}).reduce((a, b) => a + Number(b), 0), L = { past: "уже позади", now: "про меня сейчас", some: "иногда бывает", notyet: "ещё не было" };
  app.innerHTML = `
    ${astroHTML(S.num)}
    <div class="pathname"><p class="small muted" style="margin:0">Твой кармический путь</p><h1>${esc(t.name)}</h1></div>
    <p class="muted">${esc(t.theme)} · узнавание ${yes} из ${list.length * 2}</p>
    <div class="card mark"><div class="k">Девиз пути</div><p class="quote" style="margin:4px 0 0">${esc(t.motto)}</p></div>
    <h3>Уроки пути</h3>
    ${t.steps.map((st, i) => `<p style="margin:0 0 8px"><b>${i + 1}. ${esc(st[0])}</b> <span class="small muted">· ${L[(S.lessonMap || {})[i]] || "—"}</span><br><span class="small muted">${esc(st[1])}</span></p>`).join("")}
    <h3>Что изменится</h3>${PROMISE[S.num].map(([a, b], i) => `<p style="margin:0 0 6px"><b>${PROMISE_K[i]}:</b> ${esc(a)} → <b>${esc(b)}</b></p>`).join("")}
    <h3>Кто приходит к тебе как учитель</h3><ul>${t.teachers.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <h3>Что в зеркале</h3><ul>${t.mirror.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <h3>Как понять, что урок пройден</h3><p>${esc(t.done)}</p>
    <div class="row"><a class="btn block" href="#home">Назад</a></div>`;
}

function step() {
  if (!S.portrait) return go("teacher");
  const t = PATHS[S.num]; const sel = new Set(S.stepsSel || []), sit = S.teacherType === "sit";
  let sp0 = S.startPt == null ? 20 : S.startPt;
  const render = () => {
    const low = sel.size ? Math.min(...sel) : 0;
    app.innerHTML = `
      <p class="small muted" style="margin:0">${esc(t.name)} · учитель: ${esc(S.teacher)}</p>
      <h1>${sit ? "Какой урок ты проходишь в этой ситуации?" : "Какой урок ты проходишь с этим учителем?"}</h1>
      <div class="nudge" style="margin-top:0">С разными людьми и в разных ситуациях ты можешь быть на разных уроках — это нормально. Здесь отметь только то, как ты действуешь ${sit ? "в этой ситуации" : "с этим учителем"}.</div>
      ${t.steps.map((s, i) => `<button class="stepcard ${sel.has(i + 1) ? "on" : ""} ${i === 4 ? "goal" : ""}" data-i="${i + 1}"><div class="t">Урок ${i + 1}. ${esc(s[0])}${i === 4 ? " · цель пути" : ""}</div><div class="d">${esc(s[1])}</div></button>`).join("")}
      ${sel.size > 1 ? `<div class="nudge">Ты узнал себя в уроках ${[...sel].sort().join(", ")}. Твой урок сейчас — тот, где ещё осталась претензия: <b>урок ${low}</b>. Остальные уже частично пройдены.</div>` : ""}
      ${sel.size ? `<h2>Где ты сейчас на этом уроке?</h2>
        <p class="small muted">0 — ты в яме с тяжёлым рюкзаком, только заметил урок. 100 — ты на вершине. Отметь, как чувствуешь: может, ты уже на полпути.</p>
        <div class="scene" id="spv">${sceneSVG({ pct: clarity().pct, stones: Math.round(10 - sp0 / 12), pos: startPos(sp0) })}</div>
        <div class="range-val" id="spn">${sp0}</div><input type="range" id="spr" min="0" max="90" step="5" value="${sp0}" aria-label="Где ты на уроке, 0–100"><div class="range-hint"><span>← яма</span><span>вершина →</span></div>` : ""}
      <div class="row"><button class="btn block" id="ok" ${sel.size ? "" : "disabled"}>${sel.size ? `Мой урок — ${low}. Дальше` : "Отметь хотя бы один"}</button></div>`;
    document.querySelectorAll(".stepcard").forEach(b => b.onclick = () => { const i = Number(b.dataset.i); if (sel.has(i)) sel.delete(i); else sel.add(i); render(); });
    const r = document.getElementById("spr"); if (r) r.oninput = () => { sp0 = Number(r.value); document.getElementById("spn").textContent = sp0; document.getElementById("spv").innerHTML = sceneSVG({ pct: clarity().pct, stones: Math.round(10 - sp0 / 12), pos: startPos(sp0) }); };
    document.getElementById("ok").onclick = () => { S.stepsSel = [...sel]; S.step = Math.min(...sel); S.startPt = sp0; save(); go(S.sprint ? "home" : "portrait"); };
  };
  render();
}

function point() {
  S.moments0 = S.moments0 || [{ text: "", heat: 5 }];
  const render = () => {
    const m = S.moments0;
    app.innerHTML = `
      <h1>Найди точку</h1>
      <p>Вспомни последние 2–4 недели. Когда тебя по-настоящему задело — так, что прокручивал в голове, пересказывал кому-то, не мог уснуть?</p>
      <p class="small muted">Подсказки: ${MOMENT_HINTS.join(", ").toLowerCase()}.</p>
      ${(S.queue || []).length ? `<div class="card"><div class="k">Очередь учителей</div><div class="chips" id="qch">${S.queue.map((q, i) => `<button class="chip" data-i="${i}">${esc(q.text)}</button>`).join("")}</div><p class="small muted" style="margin:0">Нажми, чтобы взять момент из очереди.</p></div>` : ""}
      ${m.map((x, i) => `<div class="card moment-card"><label for="m${i}" style="margin-top:0">Момент ${i + 1}</label><input type="text" id="m${i}" placeholder="Например: брат отправил посылку родителям не так, как я просил" value="${esc(x.text)}"><p class="small muted" style="margin:10px 0 0">Если вспомнить сейчас — насколько цепляет?</p><div class="range-val" id="h${i}v" style="font-size:30px">${x.heat}</div><input type="range" id="h${i}" min="0" max="10" step="1" value="${x.heat}" aria-label="Насколько цепляет момент ${i + 1}"><div class="range-hint"><span>← 0, не цепляет</span><span>10, кипит →</span></div></div>`).join("")}
      ${m.length < 3 ? `<button class="btn ghost" id="add">+ Ещё момент</button>` : ""}
      <div class="row"><button class="btn block" id="next">Дальше</button></div>`;
    m.forEach((x, i) => { document.getElementById("m" + i).oninput = e => { x.text = e.target.value; }; const r = document.getElementById("h" + i); r.oninput = () => { x.heat = Number(r.value); document.getElementById("h" + i + "v").textContent = r.value; }; });
    document.querySelectorAll("#qch .chip").forEach(b => b.onclick = () => { const q = S.queue[Number(b.dataset.i)]; const empty = m.find(x => !x.text.trim()); if (empty) { empty.text = q.text; empty.heat = q.heat || 5; } else if (m.length < 3) m.push({ text: q.text, heat: q.heat || 5 }); render(); });
    const add = document.getElementById("add"); if (add) add.onclick = () => { m.push({ text: "", heat: 5 }); render(); document.getElementById("m" + (m.length - 1)).focus(); };
    document.getElementById("next").onclick = () => {
      const f = m.filter(x => x.text.trim()); if (!f.length) return toast("Опиши хотя бы один момент");
      const hot = f.slice().sort((a, b) => b.heat - a.heat)[0];
      S.queue = (S.queue || []).filter(q => q.text !== hot.text.trim());
      f.filter(x => x !== hot).forEach(x => { if (!S.queue.some(q => q.text === x.text.trim())) S.queue.push({ text: x.text.trim(), heat: x.heat, at: nowTs() }); });
      S.point = { text: hot.text.trim(), heat: hot.heat }; S.pointDone = true; S.moments0 = null; save(); go("teacher");
    };
  };
  render();
}

function teacher() {
  let type = S.teacherType || "person";
  const render = () => {
    const isSit = type === "sit";
    app.innerHTML = `
      ${S.point ? `<div class="card mark"><div class="k">Самая горячая точка · ${S.point.heat} из 10</div><p style="margin:4px 0 0">«${esc(S.point.text)}»</p></div>` : ""}
      <h1>Кто или что здесь твой учитель?</h1>
      <div class="nudge" style="margin-top:0"><b>Один учитель — один фокус.</b> ${esc(ONE_FOCUS)}${(S.queue || []).length ? ` В очереди: ${S.queue.length}.` : ""}</div>
      <div class="seg" id="tt"><button data-v="person" class="${!isSit ? "on" : ""}">Человек</button><button data-v="sit" class="${isSit ? "on" : ""}">Ситуация</button></div>
      <p style="margin-top:12px">${isSit ? "Ситуация, которая повторяется и забирает силы. С фокусом на неё ты пройдёшь урок." : "Тот, к кому в этой точке претензия. С фокусом на него ты пройдёшь урок."}</p>
      <div class="chips" id="ch">${(isSit ? SITS : PEOPLE).map(x => `<button class="chip" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <label for="t">${isSit ? "Опиши конкретно: что именно и с кем" : "Как ты его называешь — имя или «брат», «мама», «шеф»"}</label>
      <input type="text" id="t" placeholder="${isSit ? "Например: долг по кредиту, который тянется третий год" : "Например: брат, Ольга, шеф"}" value="${esc(S.teacherType === type ? S.teacher : "")}">
      <p class="hint">${isSit ? "Чем конкретнее, тем глубже работа. Не «работа», а «работа, где меня не слышит руководитель»." : "Лучше конкретный человек, а не «все мужчины» или «коллеги»."}</p>
      <div class="row"><button class="btn block" id="ok">Дальше</button></div>
      <div class="row" style="margin-top:0"><a class="btn ghost" href="#point">Выбрать другую точку</a></div>`;
    document.querySelectorAll("#tt button").forEach(b => b.onclick = () => { type = b.dataset.v; render(); });
    const inp = document.getElementById("t");
    document.querySelectorAll("#ch .chip").forEach(b => b.onclick = () => { inp.value = isSit ? b.dataset.v + ": " : b.dataset.v.toLowerCase(); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); });
    document.getElementById("ok").onclick = () => {
      let v = inp.value.trim().replace(/:\s*$/, ""); if (!v) return toast(isSit ? "Опиши ситуацию" : "Назови учителя");
      if (v !== S.teacher || type !== S.teacherType) { S.portrait = null; S.step = 0; S.stepsSel = []; }
      S.teacher = v; S.teacherType = type; save(); go("immerse");
    };
  };
  render();
}

function immerse() {
  if (!S.teacher) return go("teacher");
  const t = PATHS[S.num], sit = S.teacherType === "sit", hl = isHealth();
  const thoughts = c => [...new Set([...UNIV_THOUGHTS, ...t.thoughts])].map(x => "«" + x + "»");
  const qs = [
    hl ? { k: "up", lead: HEALTH_NOTE, q: c => "Что в тебе поднимает болезнь?", type: "chips", opts: HEALTH_UP, other: true, hint: "Отметь всё, что узнаёшь." }
       : { k: "hot", q: c => "Допиши три фразы — как есть, своими словами", type: "lines",
           labels: c => sit ? ["Меня злит, что…", "Должно было быть так:", "Я хочу, чтобы…"] : ["Меня злит, что " + c.T + "…", c.T + " должен(на) был(а)…", "Я хочу, чтобы " + c.T + "…"],
           hint: "Даже если звучит мелочно или несправедливо. Чем честнее — тем точнее точка." },
    { k: "body", k2: "thought", lead: "Вернись в тот момент, когда задело. Побудь в нём секунду.", q: c => "Что в теле — и какая мысль первая?", type: "chips2", l1: "В теле", opts: BODY, l2: "Первая мысль", opts2: thoughts },
    sit ? { k: "quality", q: c => hl ? "Что в этом цепляет сильнее всего?" : "Что в этой ситуации цепляет сильнее всего?", type: "short", ph: "Одним-двумя словами", tags: QUAL_S, hint: "Одним словом. Выбери или напиши своё." }
        : { k: "quality", q: c => "Какое качество в учителе цепляет сильнее всего?", type: "short", ph: "Одним-двумя словами", tags: QUAL_P, hint: "Что в нём бесит — одним словом. Это и будет твоё зеркало." },
    ...(hl ? [] : [
      { k: "prop", q: (c, a) => `Насколько твоя реакция на «${a.quality || c.Q}» сильнее, чем того стоит ситуация?`, type: "choice", opts: ["Намного сильнее — цепляет до дрожи", "Сильнее, чем стоило бы", "Примерно соразмерна"], hint: "Зеркало там, где реакция непропорциональна. Если она соразмерна поводу — скорее всего, это про границы, а не про тебя.",
        note: a => a.prop === "Примерно соразмерна" ? `<div class="nudge">Похоже, это не зеркало, а нормальная реакция на то, что действительно не в порядке. Такое решают разговором и границами. Можно выбрать другую точку — или нажать «Дальше» и продолжить с этой.</div><div class="row" style="margin-top:4px"><a class="btn secondary" href="#point">Выбрать другую точку</a></div>` : "" },
      { k: "form", q: (c, a) => `Как «${a.quality || c.Q}» живёт в тебе?`, type: "choice", opts: sit ? ["Я сам это создаю — делаю или не делаю что-то снова и снова", "Я себе запрещаю обратное — и поэтому застрял"] : ["Я тоже так делаю — с кем-то или в чём-то", "Я себе это запрещаю — и злюсь, когда другим можно"], hint: "Зеркало бывает двух видов. Выбери, что ближе — честно, без оценки себя." },
    ]),
    hl ? { k: "inme", q: (c, a) => { const w = a.quality || c.Q; return `«${w.charAt(0).toUpperCase() + w.slice(1)}» — где ещё в жизни ты так относишься к себе или к близким?`; }, type: "text", mirror: true, hint: "Например: не даёшь себе отдыха, не принимаешь помощь, всё решаешь сам." }
       : { k: "inme", q: (c, a) => { const w = a.quality || c.Q, W = w.charAt(0).toUpperCase() + w.slice(1), forb = /запреща/.test(a.form || "");
             return sit ? (forb ? `Что ты себе запрещаешь — из-за чего «${w}» держится?` : `«${W}» — как ты сам участвуешь в том, чтобы это повторялось?`) : (forb ? `Что ты себе запрещаешь? Где ты не позволяешь себе «${w}» — даже чуть-чуть?` : `Где в тебе самом есть «${w}»?`); },
           type: "text", mirror: true, hint: (c, a) => /запреща/.test(a.form || "") ? "Например: бесит безответственность брата — а ты себе никогда не позволяешь сделать как попало. Бесит лень — а ты не разрешаешь себе отдыхать." : "С другими людьми, в делах или по отношению к себе. Например: равнодушие к своему здоровью, контроль над детьми, жадность ко времени." },
    ...(hl ? [] : [{ k: "ex", q: c => "Три конкретных случая из твоей жизни, где это правда", type: "three", lbl: ["Случай 1", "Случай 2", "Случай 3"], few: "Не нашлось ни одного? Тогда это, скорее всего, не твоё зеркало. Вернись назад и попробуй другую форму или другое качество.", hint: "Не «наверное», а реальные случаи — с кем, когда. Это защита и от самообмана, и от лишнего самообвинения." }]),
    { k: "action", lead: "Увидеть в себе — половина дела. Вторая половина — одно новое действие.", q: c => "Что ты будешь делать иначе?", type: "short", ph: "Одно конкретное действие на ближайшие недели", tags: ACTIONS, hint: "Выбери или напиши своё. Это действие будет с тобой каждый день, и вечером мы спросим, получилось ли." },
  ];
  flow({ qs, c: ctx(), title: `Учитель: ${S.teacher}`, onCancel: () => go("teacher"),
    onDone: a => {
      const hot = a.hot || ["", "", ""], hotL = qs[0].labels ? qs[0].labels(ctx()) : [];
      S.portrait = { prop: a.prop, form: a.form, ex: (a.ex || []).filter(Boolean), hot, hotL, up: [...(a.up || []), a.up_other].filter(Boolean), scene: hot[0] || (S.point ? S.point.text : ""), body: [...(a.body || []), a.body_other].filter(Boolean), thought: [...(a.thought || []), a.thought_other].filter(Boolean), want: (hot[2] || "").replace(/^чтобы\s*/i, "") || "чтобы стало иначе", quality: a.quality, inme: a.inme, action: a.action };
      S.step = 0; S.stepsSel = []; save(); go("step");
    } });
}

function portraitHTML(p) {
  const sit = S.teacherType === "sit", hl = isHealth(), h = p.hot || [];
  return `
    ${S.point ? `<div class="prow"><div class="k">Точка</div>${esc(S.point.text)}</div>` : ""}
    ${hl ? `<div class="prow"><div class="k">Что поднимает болезнь</div>${esc((p.up || []).join(", "))}</div>` : `<div class="prow"><div class="k">Горячие фразы</div>${h.map((x, j) => x ? `${esc(((p.hotL || [])[j] || "").replace(/…$/, ""))} <b>${esc(x)}</b>` : "").filter(Boolean).join("<br>")}</div>`}
    <div class="prow"><div class="k">В теле · первая мысль</div>${esc([...p.body, ...p.thought].join(", "))}</div>
    <div class="prow"><div class="k">Что цепляет</div>${esc(p.quality)}</div>
    <div class="prow"><div class="k">${/запреща/.test(p.form || "") ? "Что я себе запрещаю" : sit && !hl ? "Как я в этом участвую" : "Где это во мне"}</div>${esc(p.inme)}</div>
    ${p.ex && p.ex.length ? `<div class="prow"><div class="k">Подтверждено случаями · ${p.ex.length} из 3</div>${p.ex.map(esc).join("<br>")}</div>` : ""}
    <div class="prow"><div class="k">Моё новое действие</div><b>${esc(p.action || "—")}</b></div>`;
}

function portrait() {
  if (!S.portrait) return go("immerse");
  if (!S.step) return go("step");
  const ph = phase(), sit = S.teacherType === "sit", t = PATHS[S.num];
  app.innerHTML = `
    <h1>Портрет учителя</h1>
    <p class="muted">${esc(S.teacher)}</p>
    ${isHealth() ? `<div class="card"><p class="small" style="margin:0">${esc(HEALTH_NOTE)}</p></div>` : ""}
    <div class="card">${portraitHTML(S.portrait)}</div>
    <p>«${esc(S.portrait.quality)}» снаружи и «${esc(S.portrait.inme)}» внутри — это одно и то же. Ради этого ${sit ? "ситуация и повторяется" : esc(S.teacher) + " и пришёл(а) в твою жизнь"}.</p>
    <div class="card mark"><div class="k">Твой урок</div><p style="margin:4px 0 6px">Увидеть «${esc(S.portrait.quality)}» в себе — и делать иначе:</p><p style="margin:0"><b>${esc(S.portrait.action)}</b></p></div>
    <div class="scene">${sceneSVG({ pct: clarity().pct, stones: S.point ? Math.max(3, S.point.heat) : 7, pos: 0.06 })}</div>
    <p class="small" style="margin-top:8px">Это твой рюкзак. Каждый день практики вынимает камни, тропа ведёт к флагу. ${esc(DURATION)}</p>
    <p class="small muted">Урок ${S.step}: ${esc(t.steps[S.step - 1][0])}. Точка старта: ${S.startPt || 0} из 100.</p>
    ${remindHTML()}
    ${ph === "evening" ? `<div class="card"><p style="margin:0">Путь начинается утром: первый день — это установка, которая держит тебя весь день. Сейчас ${fmtTime(nowTs())}, вечер, поэтому старт — завтра утром. Сегодня просто побудь с портретом.</p></div>
      <div class="row"><button class="btn block" id="tom">Начать завтра утром</button></div>`
    : `<div class="row"><button class="btn block" id="start">Начать путь сегодня</button></div>`}`;
  bindRemind();
  const begin = k => { S.rest = null; S.sprint = { start: k, step: S.step, teacher: S.teacher, teacherType: S.teacherType, round: 1, startPt: S.startPt || 0, days: {}, summary: null }; save(); go("home"); };
  const st = document.getElementById("start"); if (st) st.onclick = () => begin(today());
  const tom = document.getElementById("tom"); if (tom) tom.onclick = () => begin(addDays(today(), 1));
}

/* =================== SPRINT =================== */
function calStrip() {
  const sp = S.sprint, t = today();
  return `<div class="cal">${[1, 2, 3, 4, 5, 6, 7].map(n => {
    const k = addDays(sp.start, n - 1), r = sp.days[n] || {}, d = parseK(k);
    const cls = k === t ? "today" : k > t ? "future" : (!r.morning && !r.evening ? "missed" : "");
    const eDone = n === 7 ? !!sp.summary : !!r.evening;
    return `<div class="c ${cls}" title="День ${n}, ${human(k)}"><div class="w">${WD[d.getDay()]}</div><div class="n">${d.getDate()}</div><div class="dots"><i class="${r.morning ? "f" : ""}"></i><i class="${eDone ? "f" : ""}"></i></div></div>`;
  }).join("")}</div><div class="callegend">● утро · ● вечер</div>`;
}

function ladderSVG(cur) {
  const W = 330, H = 160, sw = 60, base = 138, rise = 22, x0 = 12;
  let o = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Уроки пути: ты на уроке ${cur} из 5"><line class="ground" x1="0" y1="${base + .5}" x2="${W}" y2="${base + .5}"/>`;
  for (let i = 1; i <= 5; i++) { const x = x0 + (i - 1) * sw, h = rise * i, y = base - h, cls = (i < cur ? "passed" : i === cur ? "current" : "") + (i === 5 ? " goal" : "");
    o += `<g class="step ${cls}"><rect x="${x}" y="${y}" width="${sw}" height="${h}" rx="2"/><text x="${x + 8}" y="${base - 7}">${i}</text></g>`; }
  const fx = x0 + (cur - 1) * sw + sw / 2, fy = base - rise * cur;
  o += `<g class="you"><line x1="${fx}" y1="${fy - 12}" x2="${fx}" y2="${fy - 30}"/><line x1="${fx - 8}" y1="${fy - 2}" x2="${fx}" y2="${fy - 12}"/><line x1="${fx + 8}" y1="${fy - 2}" x2="${fx}" y2="${fy - 12}"/><line x1="${fx - 9}" y1="${fy - 23}" x2="${fx + 9}" y2="${fy - 23}"/><circle cx="${fx}" cy="${fy - 37}" r="6"/></g>`;
  return o + `</svg>`;
}

function canSVG(d) {

function trendText(scores) {
  const f = scores.filter(x => x != null); if (!f.length) return "Первая отметка будет утром. Цель недели — зелёная зона, 0–2.";

      <p class="quote">${esc(A.set(c))}</p>
      <div class="task"><div class="small muted">Практика дня</div>${esc(A.task(c))}</div>
      ${sageHTML(SAGES[n])}
      <h2>Насколько сильна сейчас претензия?</h2>
      ${sliderHTML("r", score, "Претензия от 0 до 10")}
      <p class="zonelabel" id="zl">${esc(zoneOf(score)[2])}</p>
      <div class="row"><button class="btn block" id="ok">Дальше</button></div>`;
    bindSlider("r", v => { score = v; document.getElementById("zl").textContent = zoneOf(v)[2]; });
    document.getElementById("ok").onclick = () => { d.morning = { at: nowTs(), score, late: true }; save(); intro(); };
  };
  const intro = () => {
    const m = d.moments || [], tp = tapsOf(d);
    app.innerHTML = `
      <p class="small muted" style="margin:0">${late ? "Вчерашний вечер" : "Вечер"} · день ${n}: ${esc(A.title)}</p>
      <h1>Вернись в ${late ? "тот" : "сегодняшний"} день</h1>
      <p>Ты, скорее всего, уже вышел из темы — это нормально. Давай вернёмся в неё мягко.</p>
      <div class="card">
        <div class="prow"><div class="k">Утром ты принял установку</div>${esc(A.set(c))}</div>
        <div class="prow"><div class="k">Учитель</div>${esc(S.teacher)}${S.portrait ? ` · зеркало: «${esc(S.portrait.quality)}»` : ""}</div>
        <div class="prow"><div class="k">Практика дня</div>${esc(A.task(c))}</div>
        ${m.length ? `<div class="prow"><div class="k">Моменты дня · зацепило ${tp.hit}, удержался ${tp.hold}</div><ul class="moments">${m.map(x => `<li>${fmtTime(x.at)} · ${x.kind === "hit" ? "зацепило" : "удержался"}: ${esc(x.note)}</li>`).join("")}</ul></div>` : `<div class="prow"><div class="k">Моменты дня</div>Днём ничего не отмечено.</div>`}
      </div>
      <p class="muted">Закрой глаза на несколько секунд и пройди ${late ? "тот" : "этот"} день от утра до вечера. Где ${sit ? "ситуация" : "учитель"} был(а) рядом — снаружи или в мыслях?</p>
      <div class="row"><button class="btn block" id="go">Я вернулся в день</button></div>

    document.getElementById("go").onclick = run;
  };
  const run = () => {
    const tp = tapsOf(d);
    const act = S.portrait && S.portrait.action;
    const ACT_Q = act ? [{ k: "act", lead: "Снаружи — с учителем.", q: () => `Получилось сегодня твоё новое действие: «${act}»?`, type: "choice", opts: ["Да", "Частично", "Не было повода", "Нет"] }] : [];
    const OTHER_Q = { k: "other", q: () => "Цепляло сегодня что-то другое — не этот учитель?", type: "text", optional: true, ph: "Запиши коротко — уйдёт в очередь учителей", hint: `Мы работаем только с одним фокусом: ${S.teacher}. Остальное не теряется — оно ждёт в очереди.` };
    const W_Q = { k: "weight", lead: d.morning ? `Утром в рюкзаке было ${d.morning.score} ${stonesWord(d.morning.score)}${tp.hold ? `, днём выпало ${tp.hold}` : ""}.` : "", q: () => "Как сейчас твой рюкзак — насколько тяжело?", type: "scale", def: () => stonesNow(S.sprint), lo: "← 0, лёгкий", hi: "10, тяжело →", hint: "Претензия к учителю прямо сейчас. Честно — не так, как хотелось бы." };
    flow({ qs: [...A.eve, ...ACT_Q, W_Q, OTHER_Q, SIGN_Q], c, title: `${late ? "Вчерашний вечер" : "Вечер"} · день ${n}: ${A.title}${tp.hit || tp.hold ? ` · зацепило ${tp.hit}, удержался ${tp.hold}` : ""}`, onCancel: () => go("home"),
      onDone: ans => {
        let drops = dropsOf(d), advance = false; if (!drops) { drops = 1; advance = true; }
        const weight = ans.weight; delete ans.weight;
        d.evening = { at: nowTs(), answers: ans, late, drops, advance, weight };
        if (ans.sign) { S.signs = S.signs || []; S.signs.push({ at: nowTs(), text: ans.sign, teacher: S.teacher }); }
        if (ans.other) { S.queue = S.queue || []; S.queue.push({ text: ans.other, heat: 5, at: nowTs() }); }
        save();

        app.innerHTML = `<h1>День ${n} закрыт</h1>${sceneNow()}<p style="margin:10px 0 12px"><b>${lighter > 0 ? `Рюкзак стал легче на ${lighter} ${stonesWord(lighter)}.` : lighter < 0 ? "Рюкзак сегодня потяжелел — это не провал: ты увидел камни, а значит, сможешь их вынуть." : "Рюкзак держится — завтра новый шаг."}</b> Ты сделал шаг по тропе.${ans.sign ? " Знак перемен записан." : ""}${ans.other ? " Другое — в очереди учителей." : ""}</p><p class="quote">${esc(A.set(c))}</p><p>${A.next ? "Завтра: " + esc(A.next) : ""}</p>${!late ? `<p class="muted">Утром здесь будет новая установка. Хорошего вечера.</p>` : ""}<div class="row"><a class="btn block" href="#home">На главную</a></div>`;
      } });
  };
  if (!d.morning && !late) preSet(); else intro();
}

function sos() {
  if (!S.sprint) return go("home");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, hp = HPx();
  let stage = 0, raf = 0;
  const render = () => {
    cancelAnimationFrame(raf);
    if (stage === 0) {
      app.innerHTML = `<h1>Остановись</h1><p>Ничего не отвечай и ничего не делай. Дыхание по квадрату: следи за точкой. Четыре круга — около минуты.</p>
        <svg class="box" viewBox="0 0 220 220" role="img" aria-label="Дыхание по квадрату: вдох 4, задержка 4, выдох 4, задержка 4"><rect x="30" y="30" width="160" height="160" rx="10" fill="none" stroke="var(--rule)" stroke-width="6"/><text x="110" y="22" text-anchor="middle" font-size="12" fill="var(--ink-2)">вдох</text><text x="204" y="114" text-anchor="middle" font-size="12" fill="var(--ink-2)" transform="rotate(90 204 114)">задержка</text><text x="110" y="208" text-anchor="middle" font-size="12" fill="var(--ink-2)">выдох</text><text x="16" y="114" text-anchor="middle" font-size="12" fill="var(--ink-2)" transform="rotate(-90 16 114)">задержка</text><circle id="dot" cx="30" cy="30" r="11" fill="var(--red)"/></svg>
        <div class="boxlabel" id="bl">${reduce ? "Вдох на 4 · задержка на 4 · выдох на 4 · задержка на 4" : "вдох"}</div><div class="boxcount" id="bc"></div>
        <div class="row"><button class="btn block secondary" id="next">Дальше</button></div>`;
      if (!reduce) {
        const dot = document.getElementById("dot"), bl = document.getElementById("bl"), bc = document.getElementById("bc"), t0 = performance.now(), L = ["вдох", "задержка", "выдох", "задержка"];
        const tick = now => { const t = (now - t0) / 1000; if (t >= 64) { bl.textContent = "Хорошо"; bc.textContent = ""; return; }
          const side = Math.floor((t % 16) / 4), k = (t % 4) / 4, a = 30, b = 190;
          const [x, y] = side === 0 ? [a + (b - a) * k, a] : side === 1 ? [b, a + (b - a) * k] : side === 2 ? [b - (b - a) * k, b] : [a, b - (b - a) * k];
          dot.setAttribute("cx", x); dot.setAttribute("cy", y); bl.textContent = L[side]; bc.textContent = `${4 - Math.floor(t % 4)} · круг ${Math.floor(t / 16) + 1} из 4`; raf = requestAnimationFrame(tick); };
        raf = requestAnimationFrame(tick);
      }
    } else if (stage === 1) {
      app.innerHTML = `<h1 class="q">Что здесь моё?</h1><p class="muted">Учитель показывает тебе «${esc((S.portrait && S.portrait.quality) || "это")}». Где оно в тебе прямо сейчас?</p><textarea id="a" placeholder="Одна-две фразы"></textarea><div id="flag"></div><div class="row"><button class="btn block" id="next">Записать</button></div><div class="row" style="margin-top:0"><button class="btn ghost" id="skip">Пропустить</button></div>`;
      const a = document.getElementById("a"); a.focus(); a.oninput = () => { document.getElementById("flag").innerHTML = FLAG_RE.test(a.value) ? `<div class="flag">Менять другого никому не дано. Что можешь изменить ты — прямо сейчас, в своей реакции?</div>` : ""; };
      document.getElementById("skip").onclick = () => { stage++; render(); };
    } else {
      const N = sprintDay(), A = AR()[Math.min(Math.max(N, 1), 7)], c = ctx();
      app.innerHTML = `<h1>Ты справился с этим моментом</h1><p>Этот момент тебе ${esc(hp.sent)} ${esc(hp.n)} — как встречу с учителем. И ты его увидел, а не просто прожил.</p>${sageHTML(SAGES.sos)}<div class="card mark"><div class="k">Вернись к установке дня</div><p class="quote" style="margin:4px 0 0">${esc(A.set(c))}</p></div><div class="row"><a class="btn block" href="#home">На главную</a></div>`;
    }
    const nx = document.getElementById("next");
    if (nx) nx.onclick = () => {
      if (stage === 1) { const v = document.getElementById("a").value.trim(); if (!v) return toast("Хотя бы пару слов — или «Пропустить»");
        const N = sprintDay(); if (N >= 1 && N <= 7) { const d = dayRec(N); (d.sos = d.sos || []).push({ mine: v, at: nowTs() }); (d.moments = d.moments || []).push({ kind: "hit", note: "тяжело: " + v, at: nowTs() }); save(); } }
      stage++; render();
    };
  };
  render();
}

function summary() {
  const sp = S.sprint, N = sprintDay(); if (N < 7) return go("home");
  const t = PATHS[S.num], hp = HPx();
  const days = [1, 2, 3, 4, 5, 6, 7].map(n => ({ n, r: sp.days[n] || {}, k: addDays(sp.start, n - 1) }));
  const scores = days.map(d => d.r.morning ? d.r.morning.score : null), filled = scores.filter(s => s != null);

  let score = filled.length ? filled[filled.length - 1] : 5;
  app.innerHTML = `
    <p class="small muted" style="margin:0">Свод недели · ${esc(human(sp.start))} — ${esc(human(addDays(sp.start, 6)))}</p>

    <div class="card">
      <div class="k">Претензия по утрам</div>

    </div>

    ${(() => { const ws = (S.signs || []).filter(x => x.at >= parseK(sp.start).getTime() - 864e5); return ws.length ? `<div class="card"><div class="k">Знаки перемен за неделю · ${ws.length}</div><ul class="moments">${ws.map(x => `<li>${esc(x.text)}</li>`).join("")}</ul></div>` : ""; })()}
    <div class="card mark"><div class="k">Девиз твоего пути</div><p class="quote" style="margin:4px 0 0">${esc(t.motto)}</p></div>

  const ar = document.getElementById("around"); ar.oninput = () => { document.getElementById("flag").innerHTML = FLAG_RE.test(ar.value) ? `<div class="flag">Мерило пути — твоя претензия, а не поведение учителя.</div>` : ""; };

    sp.summary = { at: nowTs(), score, me, around: ar.value.trim(), passed, fake };
