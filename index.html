}

function newSprint(stepN, teacherSame) {
  const prev = S.sprint; S.archive.push(prev); S.step = stepN;
  const N = sprintDay(), start = (N === 7 || hour() >= 17) ? addDays(today(), 1) : today();
  const round = teacherSame && prev.step === stepN ? (prev.round || 1) + 1 : 1;
  if (teacherSame) { S.sprint = { start, step: stepN, teacher: S.teacher, teacherType: S.teacherType, round, days: {}, summary: null }; save(); go("home"); }
  else { S.sprint = null; S.portrait = null; S.teacher = ""; S.pointDone = false; S.point = null; S.step = 0; save(); go("point"); }
}

function decide(score, passed) {
  const sp = S.sprint, t = PATHS[S.num], cur = sp.step, hp = HPx(), cl = clarity(), round = sp.round || 1, np = Math.min(3, round + 1);
  window.scrollTo(0, 0);
  if (passed) return celebrate();
  const calm = score <= 2, fake = sp.summary && sp.summary.fake, minR = (lessonSprints(sp)[0].startPt || 0) >= 50 ? 2 : 3;
  if (fake) {
    app.innerHTML = `
      <h1>Похоже, ты перестал смотреть, а не перестал цеплять</h1>
      <div class="scene">${sceneSVG({ pct: cl.pct, stones: 4, pos: lessonPos(sp), dropped: lessonHolds(sp) })}</div>
      <p class="quote">Претензия низкая, но рядом с ней — холод или желание отвернуться.</p>
      <p>Это не провал и не стыдно. Так психика защищается: когда больно, проще сказать «мне всё равно». Но равнодушие — это камни, которые просто убрали из виду: рюкзак всё ещё тяжёлый. Принятие — это когда можно спокойно подумать об учителе и не хочется ни воевать, ни бежать.</p>
      <div class="card"><div class="k">Неделя ${round + 1} · фаза «${PHASES[np][0]}»</div><p style="margin:4px 0 0">Попробуй на этой неделе подойти ближе: вспомнить учителя спокойно, без оценки — и замечать, что поднимается.</p></div>
      <div class="row"><button class="btn block" id="again">Неделя ${round + 1}, тот же учитель: ${esc(S.teacher)}</button></div>`;
    document.getElementById("again").onclick = () => newSprint(cur, true);
    return;
  }
  app.innerHTML = `
    <h1>${calm ? "Рюкзак почти пуст — закрепляем" : "Ещё один отрезок тропы"}</h1>
    <div class="scene">${sceneSVG({ pct: cl.pct, stones: score, pos: lessonPos(sp), dropped: lessonHolds(sp) })}</div>
    <p class="quote">${calm ? `В рюкзаке ${score} ${stonesWord(score)} — это зелёная зона.` : `В рюкзаке ${score} ${stonesWord(score)}. Урок ещё не пройден — и это нормально.`}</p>
    <p>${calm ? (round < minR ? `До флага остаётся пара шагов: урок засчитывается не раньше ${minR === 2 ? "второй" : "третьей"} недели — новой реакции нужно время, чтобы стать твоей.` : "Чтобы дойти до флага, рюкзак должен оставаться лёгким (2 и меньше) две недели подряд. Ещё неделя — и проверим.") : "Каждая неделя — отрезок тропы. Ты идёшь, даже когда кажется, что стоишь: камни, которые ты увидел, уже легче нести."}</p>
    <div class="card"><div class="k">Неделя ${round + 1} · фаза «${PHASES[np][0]}»</div><p style="margin:4px 0 0">${esc(PHASES[np][1].charAt(0).toUpperCase() + PHASES[np][1].slice(1))}.</p></div>
    <p class="small muted">${esc(DURATION)}</p>
    <div class="row"><button class="btn block" id="again">Неделя ${round + 1}, тот же учитель: ${esc(S.teacher)}</button></div>
    <div class="row" style="margin-top:0"><button class="btn block secondary" id="re">Сначала обновить портрет учителя</button></div>`;
  document.getElementById("again").onclick = () => newSprint(cur, true);
  document.getElementById("re").onclick = () => { S.archive.push(S.sprint); S.sprint = null; S.portrait = null; save(); go("immerse"); };
}

function celebrate() {
  const sp = S.sprint, t = PATHS[S.num], cur = sp.step, hp = HPx(), cl = clarity(), ls = lessonSprints(sp);
  const holds = lessonHolds(sp), since = parseK(ls[0].start).getTime() - 864e5, sg = (S.signs || []).filter(x => x.at >= since).length;
  const pr = PROMISE[S.num][(cur - 1) % 3], cols = ["#FBE7A8", "#E2B65A", "#B9822A", "#C9BFFF", "#8C84C8", "#F2C4B0"];
  const conf = `<div class="confetti" aria-hidden="true">${Array.from({ length: 60 }, (_, k) => `<i style="left:${(k * 37) % 100}%;background:${cols[k % 6]};animation-delay:${(k % 12) * 0.12}s;animation-duration:${2.6 + (k % 5) * 0.3}s"></i>`).join("")}</div>`;
  app.innerHTML = `${conf}
    <p class="fanfare">Флаг твой!</p>
    <div class="scene">${sceneSVG({ pct: cl.pct, stones: 0, flag: true, celebrate: true })}</div>
    <h1 style="margin-top:14px">${cur < 5 ? `Урок ${cur} пройден` : "Путь с этим учителем пройден"}</h1>
    <p>Ты дошёл до вершины и снял рюкзак. Это сделал ты сам — неделя за неделей, честно глядя в зеркало. Карма очистилась, и небо над тропой стало светлее навсегда: ${cl.pct}% ясности.</p>
    <div class="stats"><div><b>${ls.length}</b><span>${ls.length === 1 ? "неделя" : ls.length < 5 ? "недели" : "недель"} пути</span></div><div><b>${holds}</b><span>${stonesWord(holds)} выпало</span></div><div><b>${sg}</b><span>знаков перемен</span></div></div>
    <div class="card mark"><div class="k">Смотри, что теперь меняется</div><p style="margin:4px 0 0">Было — ${esc(pr[0])}. Становится — <b>${esc(pr[1])}</b>. Записывай знаки перемен: они будут приходить.</p></div>
    <h2>Что дальше?</h2>
    ${cur < 5 ? `<p class="small muted">Следующий урок пути — «${esc(t.steps[cur][0])}». ${esc(t.steps[cur][1])}</p><div class="row"><button class="btn block" id="up">Урок ${cur + 1} с тем же учителем</button></div>` : ""}
    <div class="row" style="margin-top:0"><button class="btn block secondary" id="newT">Выбрать нового учителя</button></div>
    <div class="row" style="margin-top:0"><button class="btn block ghost" id="rest">Пока нового учителя нет — отдохнуть у флага</button></div>
    <p class="small muted">Новый учитель придёт сам — ${hp.n} ${hp.will} его, когда будет время. Раз в неделю мы спросим, не появился ли он.</p>`;
  const up = document.getElementById("up"); if (up) up.onclick = () => newSprint(cur + 1, true);
  document.getElementById("newT").onclick = () => newSprint(Math.min(cur + 1, 5), false);
  document.getElementById("rest").onclick = () => { S.archive.push(S.sprint); S.sprint = null; S.rest = { since: today() }; S.teacher = ""; S.portrait = null; S.step = 0; save(); go("home"); };
}

/* =================== OTHER SCREENS =================== */
function sky() {
  const sp = S.sprint, cl = clarity(), signs = S.signs || [];
  const passed = [...S.archive, ...(sp && sp.summary ? [sp] : [])].filter(a => a.summary && a.summary.passed);
  app.innerHTML = `
    <h1>Твой путь</h1>
    ${sp ? sceneNow() : `<div class="scene">${sceneSVG({ pct: cl.pct, stones: 0, flag: true })}</div>`}
    <p class="gstage" style="margin-top:12px;font-family:var(--serif);font-size:26px;font-weight:700">Небо: ${cl.pct}% ясности</p>
    <div class="gsteps">${[20, 40, 60, 80, 100].map(v => `<i class="${cl.pct >= v ? "on" : ""}"></i>`).join("")}</div>
    <div class="card">
      <div class="prow"><div class="k">Рюкзак</div>Утром ты отмечаешь, насколько сильна претензия, — столько камней в рюкзаке. «Удержался» днём — камень выпадает. Вечером ты смотришь, насколько легче стало.</div>
      <div class="prow"><div class="k">Тропа и флаг</div>Каждый закрытый день — шаг по тропе. Флаг на вершине — урок пройден: рюкзак остаётся лёгким (2 и меньше) две недели подряд, не раньше третьей недели. ${esc(DURATION)}</div>
      <div class="prow"><div class="k">Небо</div>Каждый пройденный урок навсегда делает небо над тропой светлее: +20%. Каждая неделя работы — +4%. Чистое небо — финал пути.</div>
      <div class="prow"><div class="k">Флаги · ${passed.length}</div>${passed.length ? passed.map(a => `<span class="icline" style="align-items:center">${ic("flag", "")}${esc(a.teacher)} — урок ${a.step}</span>`).join("") : "Пока ни одного. Первый флаг — впереди."}</div>
    </div>
    <h2>Очередь учителей · ${(S.queue || []).length}</h2>
    ${(S.queue || []).length ? `<ul class="list">${S.queue.map(q => `<li>${esc(q.text)}</li>`).join("")}</ul><p class="small muted">Они ждут. Когда пройдёшь текущий урок, выберешь следующего отсюда.</p>` : `<p class="muted">Пока пусто. Всё, что цепляет помимо текущего учителя, записывай сюда — чтобы не распылять фокус.</p>`}
    <h2>Знаки перемен · ${signs.length}</h2>
    ${signs.length ? `<ul class="list">${signs.slice().reverse().map(x => `<li><div class="date">${esc(human(dkey(x.at)))} · ${esc(x.teacher || "")}</div>${esc(x.text)}</li>`).join("")}</ul>` : `<p class="muted">Здесь соберётся всё, что стало лучше в людях, ситуациях и обстоятельствах. Отмечай вечером — это твои доказательства.</p>`}`;
}

function history() {
  const sp = S.sprint;
  const block = (s, title) => {
    const rows = [1, 2, 3, 4, 5, 6, 7].map(n => {
      const r = s.days[n] || {}, k = addDays(s.start, n - 1);
      if (!r.morning && !r.evening && !(r.moments || []).length) return "";
      let html = `<li><div class="date">День ${n} · ${esc(human(k))} · ${esc(AR(s)[n].title)}</div>`;
      if (r.morning) html += `<div class="small muted">${r.morning.late ? "Установка вечером" : "Утро " + fmtTime(r.morning.at)}: претензия ${r.morning.score}</div>`;
      (r.moments || []).forEach(x => html += `<div class="small" style="color:${x.kind === "hit" ? "var(--red)" : "var(--green)"}">${fmtTime(x.at)} ${x.kind === "hit" ? "зацепило" : "удержался"}: ${esc(x.note)}</div>`);
      if (r.evening) html += Object.entries(r.evening.answers).filter(([kk, v]) => v && !kk.endsWith("_other")).map(([kk, v]) => `<div>${esc(Array.isArray(v) ? v.join("; ") : v)}</div>`).join("");
      (r.sos || []).forEach(x => html += `<div class="small muted">${fmtTime(x.at)} тяжело — моё: ${esc(x.mine)}</div>`);
      return html + `</li>`;
    }).join("");
    return `<h2>${title}</h2>${rows ? `<ul class="list">${rows}</ul>` : `<p class="muted">Пока без записей.</p>`}`;
  };
  app.innerHTML = `
    <h1>История</h1>
    ${sp ? block(sp, `Эта неделя · ${esc(sp.teacher)} · урок ${sp.step}`) : ""}
    ${S.archive.slice().reverse().map(a => `<div class="card"><div class="k">${esc(human(a.start))} — ${esc(human(addDays(a.start, 6)))}</div><b>${esc(a.teacher)}</b>, урок ${a.step}, неделя ${a.round || 1}${a.summary && a.summary.passed ? " · урок пройден" : ""}${a.summary ? ` · итог: претензия ${a.summary.score}` : " · без свода"}${a.summary && a.summary.me ? `<p class="small" style="margin:6px 0 0">Во мне: ${esc(a.summary.me)}</p>` : ""}</div>`).join("")}`;
}

function icsFile() {
  const r = S.remind || { m: "08:30", d: "13:00", e: "20:30" }, url = /^https?:/.test(location.href) ? location.href.split("#")[0] : "";
  const d = nowDate(), ymd = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`, stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const ev = (key, time, title, desc) => { const [h, mi] = time.split(":"); const st = `${ymd}T${pad(h)}${pad(mi)}00`;
    return ["BEGIN:VEVENT", `UID:putkarmy-${key}-${ymd}@local`, `DTSTAMP:${stamp}`, `DTSTART:${st}`, "DURATION:PT10M", "RRULE:FREQ=DAILY", `SUMMARY:${title}`, `DESCRIPTION:${desc}${url ? "\\n" + url : ""}`, url ? `URL:${url}` : "", "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${title}`, "TRIGGER:PT0M", "END:VALARM", "END:VEVENT"].filter(Boolean).join("\r\n"); };
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Put karmy//RU", "CALSCALE:GREGORIAN",
    ev("m", r.m, "Путь кармы: установка дня", "Две минуты: сколько камней в рюкзаке и установка на день."),
    ev("d", r.d, "Путь кармы: проверь себя", "Зацепило или удержался? Отметь момент, пока он живой."),
    ev("e", r.e, "Путь кармы: вечерняя рефлексия", "Вернись в день и посмотри, насколько легче стал рюкзак."), "END:VCALENDAR"].join("\r\n");
}
function downloadIcs() {
  try { const b = new Blob([icsFile()], { type: "text/calendar" }), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "put-karmy-napominaniya.ics"; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast("Файл скачан — открой его, чтобы добавить в календарь"); }
  catch (e) { toast("Не получилось скачать здесь. Открой приложение файлом в браузере и попробуй снова."); }
}
function remindHTML() {
  const r = S.remind || {};
  return `<div class="card"><div class="k">Напоминания</div>
    <p class="small" style="margin:4px 0 8px">Три раза в день календарь телефона напомнит заглянуть: утром — установка, днём — проверить себя, вечером — рефлексия. Выбери время и добавь в календарь.</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${[["m", "Утро"], ["d", "День"], ["e", "Вечер"]].map(([k, l]) => `<label style="margin:0;font-size:13px">${l}<input type="time" data-rk="${k}" value="${esc(r[k] || "")}" style="font:inherit;width:100%;padding:8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)"></label>`).join("")}</div>
    ${window.claude ? `<p class="small muted" style="margin:10px 0 0">В этой версии внутри Claude календарь добавить нельзя. Открой приложение файлом в браузере телефона — там появится кнопка «Добавить в календарь».</p>` : `<div class="row"><button class="btn block secondary" id="ics">Добавить напоминания в календарь</button></div>`}</div>`;
}
function bindRemind() {
  document.querySelectorAll("[data-rk]").forEach(i => i.onchange = () => { S.remind = S.remind || {}; S.remind[i.dataset.rk] = i.value; save(); });
  const b = document.getElementById("ics"); if (b) b.onclick = downloadIcs;
}

function settings() {
  app.innerHTML = `
    <h1>Настройки</h1>
    <h3>Кто посылает учителей</h3>
    <div class="seg" id="hp">${Object.entries(HP).map(([k, v]) => `<button data-v="${k}" class="${S.hp === k ? "on" : ""}">${v.N}</button>`).join("")}</div>
    <h3>Оформление</h3>
    <div class="seg" id="theme"><button data-v="auto" class="${S.theme === "auto" ? "on" : ""}">По времени суток</button><button data-v="light" class="${S.theme === "light" ? "on" : ""}">Рассвет</button><button data-v="dark" class="${S.theme === "dark" ? "on" : ""}">Звёздный вечер</button></div>
    <p class="hint">«По времени суток»: утром и днём — рассвет, с 17:00 — звёздный вечер.</p>
    <h3>Путь, урок и учитель</h3>
    <p class="small muted">${S.num ? esc(PATHS[S.num].name) : "Путь ещё не выбран"}${S.teacher ? ` · урок ${S.sprint ? S.sprint.step : S.step} · учитель — ${esc(S.teacher)}` : ""}</p>
    <div class="row"><a class="btn secondary" href="#path">Мой путь</a><a class="btn secondary" href="#method">Как это работает</a></div>
    <div class="row" style="margin-top:0"><button class="btn secondary" id="newt">Сменить учителя или урок</button></div>
    <p class="hint">Текущая неделя уйдёт в историю, новая начнётся с поиска точки.</p>
    ${remindHTML()}
    <h3>Время для проверки</h3>
    <p class="small muted">Сдвигает часы приложения, чтобы пройти неделю за минуты. Сейчас в приложении: ${esc(human(today()))}, ${fmtTime(nowTs())}${S.sprint ? `, день ${sprintDay()} недели` : ""}.</p>
    <div class="row"><button class="btn secondary" data-o="6">+6 часов</button><button class="btn secondary" data-o="24">+1 день</button><button class="btn secondary" data-o="0">Настоящее время</button></div>
    <h3>Начать заново</h3>
    <p class="small muted">Удалит дату, путь, флаги и все записи на этом устройстве.</p>
    <div class="row"><button class="btn secondary" id="reset">Стереть всё</button></div>`;
  bindRemind();
  document.querySelectorAll("#hp button").forEach(b => b.onclick = () => { S.hp = b.dataset.v; save(); settings(); });
  document.querySelectorAll("#theme button").forEach(b => b.onclick = () => { S.theme = b.dataset.v; save(); applyTheme(); settings(); });
  document.querySelectorAll("[data-o]").forEach(b => b.onclick = () => { const o = Number(b.dataset.o); S.offsetH = o ? (S.offsetH || 0) + o : 0; save(); lastDay = today(); route(); });
  document.getElementById("newt").onclick = e => { const b = e.currentTarget; if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = "Точно? Нажми ещё раз — неделя уйдёт в историю"; return; } if (S.sprint) S.archive.push(S.sprint); S.sprint = null; S.rest = null; S.step = 0; S.stepsSel = []; S.portrait = null; S.teacher = ""; S.pointDone = false; S.point = null; save(); go("point"); };
  document.getElementById("reset").onclick = e => { const b = e.currentTarget; if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = "Точно? Нажми ещё раз — всё удалится"; b.style.borderColor = "var(--red)"; b.style.color = "var(--red)"; return; } try { localStorage.removeItem(KEY); } catch (e) {} const keep = { hp: S.hp, theme: S.theme }; S = Object.assign(JSON.parse(JSON.stringify(DEF)), keep); save(); go("onb"); };
}

function method() {
  app.innerHTML = `
    <h1>Как это работает</h1>
    <p class="quote">${esc(SLOGAN)}</p>
    <p class="muted">${esc(IDEA)} Учитель — человек или ситуация, которые цепляют. Цепляет то, что есть в тебе. Увидел в себе — делаешь иначе. Урок пройден, когда уходит претензия.</p>
    ${AXIOMS().map(([h, b], i) => `<h2>${i + 1}. ${esc(h)}</h2><p>${esc(b)}</p>`).join("")}
    <h2>Как устроен урок</h2>
    <p>${esc(DURATION)} Урок идёт фазами по неделе: «Увидеть» — замечаешь, ничего не меняя; «Понять» — смотришь в зеркало глубже; «Менять» — пробуешь новые реакции. Урок пройден, когда претензия держится на 2 и ниже две недели подряд.</p>
    <h2>Как устроена неделя</h2>
    <p>Утро — установка, день — замечаешь моменты, вечер — рефлексия. Семь дней — семь шагов: наблюдаю, не реагируя; ищу зеркало; вижу претензию как ожидание; нахожу, что учитель уже дал; пробую другую реакцию; делаю шаг из следующего урока; подвожу итог. Каждый день — изречение мыслителя о том же, что ты проживаешь.</p>
    <h2>На чём основан метод</h2>
    ${basisHTML(true)}
    <h2>Рюкзак и тропа</h2>
    <p>Неотработанная карма — как рюкзак с камнями. Утром ты видишь, сколько их сегодня; «Удержался» днём — камень выпадает; каждый закрытый день — шаг по тропе к флагу. Пройденный урок — флаг на вершине и небо светлее навсегда.</p>
    <p class="small muted">Это не психологическая помощь и не диагностика. Если в твоей ситуации есть угроза здоровью или безопасности — обратись к специалисту или близким.</p>
    <div class="row"><a class="btn block" href="#home">Назад</a></div>`;
}

route();
</script>
